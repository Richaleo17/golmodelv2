<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070816">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GolModel">
<title>GolModel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<section id="login" class="login" hidden>
  <form id="login-form" autocomplete="on">
    <div class="logo-big"><svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true"><use href="icon.svg#g"/></svg></div>
    <h1>GolModel</h1>
    <p class="sub">PROBABILIDADES CALIBRADAS · VALOR SIN MARGEN · RIESGO CONTROLADO</p>
    <label for="clave">Contraseña</label>
    <input id="clave" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primario" type="submit">Entrar</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="logo"><svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><use href="icon.svg#g"/></svg>
      <div><h1>GolModel</h1><div class="sub" id="sub-estado">—</div></div></div>
    <div class="der"><span id="chip-rol" class="chip" hidden>👀 Solo consulta</span><button id="salir" class="btn mini" type="button" aria-label="Salir">Salir</button></div>
  </header>
  <div class="fechabar">
    <button id="dia-ant" class="btn mini" type="button" aria-label="Día anterior">‹</button>
    <input id="dia" type="date" aria-label="Fecha">
    <button id="dia-sig" class="btn mini" type="button" aria-label="Día siguiente">›</button>
    <button id="dia-hoy" class="btn mini" type="button">Hoy</button>
  </div>
  <div id="aviso-global" class="aviso" hidden></div>
  <main id="vista" tabindex="-1"></main>
  <nav id="nav" aria-label="Secciones">
    <button data-v="diario" aria-current="page"><span class="ic">⚽</span>Diario</button>
    <button data-v="meter"><span class="ic">🎯</span>Qué meter</button>
    <button data-v="sonadoras"><span class="ic">🎰</span>Soñadoras</button>
    <button data-v="nfl"><span class="ic">🏈</span>NFL</button>
    <button data-v="cuotas"><span class="ic">💲</span>Cuotas</button>
    <button data-v="datos"><span class="ic">🛠️</span>Datos</button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>

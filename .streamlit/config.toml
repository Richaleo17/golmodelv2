# Tema "noche de estadio": azul-violeta profundo, acento violeta; verde/ámbar/rosa solo para probabilidades.
[theme]
base = "dark"
primaryColor = "#9a85ff"              # violeta: acción
backgroundColor = "#0a0a1f"
secondaryBackgroundColor = "#12122e"
textColor = "#e8e8ff"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

# Sedes habituales (dónde juega de local cada equipo) para los FACTORES DE PARTIDO (modelos/factores_partido.py).
#   lat, lon : coordenadas de la ciudad del estadio (clima del día del partido vía Open-Meteo)
#   alt      : altitud en metros (la altitud cambia mucho el rendimiento del visitante no aclimatado)
#   ambiente : 0..1, qué tan hostil/ruidoso es el estadio para el visitante (0.5 = promedio; ya va dentro de la ventaja de local)
# Valores aproximados (ciudad, no el estadio exacto). Un equipo que falte simplemente no recibe ajuste de altitud/clima/ambiente.
# El nombre es el de The Odds API / la base (inglés para selecciones).


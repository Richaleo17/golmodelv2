# golmodelv2 · configuración única. Ningún umbral vive en el código.
# Cada versión de modelo guarda una copia de este archivo y su hash.

zona_horaria: America/Mexico_City

# Cada liga activa gasta ~2 créditos de The Odds API por actualización, pero SOLO si ese día tiene partidos.
# Si te quedas corto de créditos (plan gratis: 500 al mes), quita ligas de esta lista.
ligas_activas: [EPL, LL, SA, BUN, L1, MX1, MXF, MLS, BR1, ERE, BEL, POR]
historico:
  temporadas: 5            # + la temporada en curso
  # EPL y SA: xG de Understat (goles + xG). MX1, MLS, BR1: solo goles.
  # MXF (Liga MX Femenil): sin CSV de football-data; el histórico sale de API-Football por temporada (1 request c/u).

fuentes:
  api_football:
    plan: free
    limite_diario: 100     # VERIFICAR EN DOCUMENTACIÓN (y acceso a temporada actual)
    reserva_diaria: 10     # nunca gastar las últimas N
  odds_api:
    plan: free
    creditos_mensuales: 500   # VERIFICAR EN DOCUMENTACIÓN
    reserva_cierres: 150      # créditos apartados para snapshots de cierre
    regiones: [eu]            # costo = mercados × regiones
    mercados: [h2h, totals]   # BTTS / equipo anota: captura manual en el MVP
  understat:
    min_segundos_entre_requests: 5
  football_data:
    usar_cierre_como_respaldo: true
  football_data_org:
    plan: free              # 10 requests/min; cubre EPL, SA, BR1 (respaldo de fixtures/resultados)
  thesportsdb:
    plan: free              # último respaldo de fixtures; sus resultados no liquidan sin confirmar

# Orden de respaldo por capacidad. Solo se pueden usar combinaciones
# aprobadas en golmodel/ingesta/proveedores/registro.py (EQUIVALENCIA).
cadenas:
  fixtures:      [api_football, football_data_org, odds_api, thesportsdb]   # odds_api cubre las 5 ligas
  resultados:    [api_football, football_data_org, football_data_csv, thesportsdb]
  xg:            [understat]          # una sola familia de xG, sin sustitutos
  xg_jugadores:  [understat]
  lesiones:      [api_football]       # sin respaldo gratis -> captura manual / aviso
  alineaciones:  [api_football]
  cuotas:        [odds_api, api_football]
  cuotas_cierre: [odds_api, api_football, football_data_csv]
  calendario:    [api_football]       # sin él, el parámetro de fatiga del CRS queda "no disponible"

frescura:
  cuotas_max_min: 60
  cuotas_max_min_cerca: 15
  horas_cerca_inicio: 3
  modelo_max_dias: 3

cierre:
  minutos_antes: 5
  solo_partidos_con_picks: true   # ahorra créditos del plan gratis
  reintentos: 2

modelo:
  familia_xg: understat             # cambiarla exige reingerir histórico y recalibrar
  goles_max: 10
  calibracion_semanal_dias: 7
  decaimiento_xi_inicial: 0.0019    # por día (vida media ≈ 365 d); se recalibra
  w_xg_inicial: 0.5                 # se recalibra en EPL/SA; 0 donde no hay xG
  l2_lambda_inicial: 1.0
  prior_ascendidos: ninguno         # 'promedio_historico' solo si backtest/validar_prior.py lo respalda con datos reales
  l2_ascendidos: 8.0                # fuerza con la que un ascendido se jala a su prior (se elige con la validación)
  rho_limites: [-0.2, 0.2]
  rho_prior: {media: -0.06, desviacion: 0.05}   # prior normal sobre ρ (diseño; rango típico en la literatura)
  rejilla_calibracion:              # walk-forward semanal (log-loss 1X2)
    xi: [0.001, 0.002, 0.004, 0.007]
    w_xg: [0.0, 0.3, 0.5, 0.7]

contexto:
  tope_ajuste_lambda: -0.15
  minutos_min_jugador: 450          # menos minutos = no se ajusta
  ligas_con_ajuste: [EPL, SA]       # requiere xG + xA por jugador (Understat)
  factor_reemplazo: 0.5             # el reemplazo aporta en promedio la mitad (decisión de diseño)
  tipos_con_ajuste: [lesion, suspension]   # 'duda' no ajusta λ, solo avisa
  similitud_min_jugador: 0.85

mercado:
  metodo_devig: shin                # alternativa: potencia
  casa_referencia: Pinnacle
  # Casa contra la que se calcula el EV de los picks. Una sola casa fija: tomar la MEJOR
  # cuota entre muchas casas sesga el EV hacia arriba (se elige el error más favorable).
  # Una cuota capturada a mano para 'manual' reemplaza a esta si está vigente.
  casa_ejecucion: pinnacle
  casa_manual_nombre: Draftea       # cómo se llama en pantalla la casa donde capturas cuotas a mano
  alpha_por_defecto: 0.25           # si no hay ni α propio ni agrupado: el mercado manda (suele ser más preciso)
  factor_alpha_no_calibrado: 0.5    # α_no_cal = factor × α(1X2 de la liga)
  umbral_extra_no_calibrado: 0.02
  # Si falta la casa de referencia, p_mercado = mediana sin margen del resto:
  umbral_extra_referencia_sustituta: 0.02
  min_casas_consenso: 3             # con menos casas no se calcula p_mercado (no se apuesta)

# CRS · Casinazo Risk Score (heurística de dominio; pesos y umbrales NO calibrados)
crs:
  version: crs_v1
  factor_credibilidad: {MEDIA: 0.96, ALTA: 0.88}   # solo ordena combinaciones (la p mostrada no cambia)
  pesos: {divergencia_xpts: 20, brecha_probabilidad: 25, fatiga: 20, motivacion: 20, fragilidad_defensiva: 15}
  umbrales:
    divergencia_xpts: {partidos: 5, puntos: 4}       # (puntos reales − xPts) > 4 en últimos 5
    brecha_probabilidad: 0.10                        # p_mercado(sin margen) − p_modelo del favorito
    fatiga: {horas_descanso: 72, solo_si_previo_copa_o_fuera: true}
    motivacion: {puntos_lucha: 3}
    fragilidad_defensiva: {partidos: 3, xga: 1.5}
  min_prob_favorito: 0.40          # por debajo no hay "favorito" y el CRS no aplica
  min_parametros_disponibles: 3    # con menos, CRS = INSUFICIENTE
  alerta: {alta: 70, media: 40}
  veto:
    umbral: 70
    aplica_simples: true           # también bloquea picks simples del favorito (Módulo 1)
    selecciones: [gana_favorito, handicap_favorito, doble_oportunidad_favorito]
  ajuste_favorito:
    modo: sombra                   # sombra = se calcula y guarda, NO entra a p_adj; activo tras validarlo
    reduccion_lambda: 0.10         # λ_favorito × (1 − 0.10) si CRS >= umbral de veto
    criterio_activacion: "walk-forward: log-loss con ajuste < sin ajuste en partidos con CRS ALTA (n >= 200)"
  # Fronteras de la tabla por liga: la posición b separa b de b+1.  VERIFICAR formatos 2026.
  objetivos:
    EPL: [{tipo: titulo, ultima_posicion: 1}, {tipo: clasificacion, ultima_posicion: 4}, {tipo: descenso, ultima_posicion: 17}]
    SA:  [{tipo: titulo, ultima_posicion: 1}, {tipo: clasificacion, ultima_posicion: 4}, {tipo: descenso, ultima_posicion: 17}]
    BR1: [{tipo: titulo, ultima_posicion: 1}, {tipo: clasificacion, ultima_posicion: 6}, {tipo: descenso, ultima_posicion: 16}]
    MX1: [{tipo: clasificacion, ultima_posicion: 6}, {tipo: playoff, ultima_posicion: 10}]   # sin descenso
    MXF: [{tipo: clasificacion, ultima_posicion: 8}]   # liguilla de 8, sin descenso
    MLS: []                        # playoffs por conferencia: requiere equipo_temporada.grupo
    LL:  [{tipo: titulo, ultima_posicion: 1}, {tipo: clasificacion, ultima_posicion: 4}, {tipo: descenso, ultima_posicion: 17}]
    BUN: [{tipo: titulo, ultima_posicion: 1}, {tipo: clasificacion, ultima_posicion: 4}, {tipo: descenso, ultima_posicion: 15}]
    L1:  [{tipo: titulo, ultima_posicion: 1}, {tipo: clasificacion, ultima_posicion: 3}, {tipo: descenso, ultima_posicion: 15}]
    ERE: [{tipo: titulo, ultima_posicion: 1}, {tipo: clasificacion, ultima_posicion: 4}, {tipo: descenso, ultima_posicion: 15}]
    POR: [{tipo: titulo, ultima_posicion: 1}, {tipo: clasificacion, ultima_posicion: 4}, {tipo: descenso, ultima_posicion: 15}]
    BEL: []                        # formato con playoffs: sin parámetro de motivación

# Panel "Diario" y "Qué meter"
sugerencias:
  p_segura: 0.72                    # probabilidad desde la que una jugada se etiqueta "segura"
  p_equilibrada: 0.55
  confianza_min_segura: 5.0         # con poca confianza en los datos, una jugada no se etiqueta "segura"
  cuota_justa_minima: 1.20          # no se sugieren jugadas que pagarían menos (no valen la comisión)
  valor_p_min: 0.30                 # «con valor» solo para jugadas con al menos esta probabilidad (las de muy baja
                                    # probabilidad con EV enorme casi siempre son error del modelo)
  valor_ev_sospechoso: 0.20         # EV mayor a esto se marca «desconfía»
  max_por_partido: 3
  max_mejores: 12
  rompe:                            # cuándo un partido "rompe parlays"
    caida_modelo_vs_mercado: 0.06
    empate_alto: 0.30
    confianza_max: 3.5
    peso_bajo: 12.0                 # historial efectivo mínimo para culpar al favorito de una discrepancia
  # RETIRADOS (2026-11-09): `perfiles`, `mas_seguros`, `ticket` y `top_piernas` configuraban parlays por producto de probabilidades
  # (independencia). Se rediseñarán sobre tickets.py tras validar V3 con datos reales (están en el historial de git).

# Competiciones SIN histórico ni modelo propio (Champions, Europa League, selecciones, ligas menores…).
# La probabilidad es la del mercado sin margen (Pinnacle o consenso); el panel las marca «SOLO MERCADO».
# Se descubren en The Odds API con GET /v4/sports (gratis) y solo se consultan las que tienen partidos en la ventana.
competiciones_mercado:
  activo: true
  max_creditos_por_actualizacion: 16     # tope de créditos (2 por competición con partidos)
  max_creditos_resultados: 6             # resultados de selecciones (/scores, 2 créditos c/u): sin esto el modelo de selecciones no ve los marcadores
  patrones: [uefa_champs, uefa_europa, uefa_conf, nations_league, friendl, qualif, world_cup, euro,
             efl_champ, bundesliga2, ligue_two, serie_b, segunda, spl, turkey, argentina, saudi, japan,
             libertadores, sudamericana, concacaf, copa]
  excluir: [winner, outright, women, womens]
  # Femeniles INCLUIDAS por decisión del responsable (2026-11-10) aunque `excluir` tenga women/womens. Reglas de TOKENS sobre la clave del deporte de
  # The Odds API (cada grupo = alternativas; deben aparecer los 3 grupos/2 grupos). Las claves exactas NO están verificadas (sin acceso a GET /v4/sports):
  # si la API no ofrece la competición, no aparece. Sin histórico ni modelo: solo mercado, sin picks ni tickets V3, fuera de la calibración.
  # Liga MX Femenil salió de aquí (2026-11-11): tiene modelo propio (ligas_activas: MXF) y The Odds API no la ofrece.
  femeniles:
    - {nombre: "UEFA Women's Champions League", todos: [[uefa], [champs], [women, womens]]}

# ---------------------------------------------------------------------------------------------------------------------------------
# Mercados NUEVOS (2026-11-11). Modelos PARALELOS: no cambian Dixon-Coles, la matriz de goles ni los tickets V3.
# Valores de diseño, PROVISIONALES hasta medirlos en walk-forward con datos reales.
corners:
  ligas: [EPL, LL, SA, BUN, L1, ERE, BEL, POR]   # las que traen córners en los CSV de football-data (HC/AC). Árbitro: solo EPL.
  decaimiento_xi: 0.002            # mismo orden que el modelo de goles (vida media ≈ 1 año)
  l2: 2.0                          # encogimiento de ataque/concede hacia el promedio
  l2_arbitro: 20.0                 # el efecto árbitro se encoge mucho (es pequeño y ruidoso)
  min_partidos_arbitro: 15
  min_partidos_liga: 200           # con menos, la liga no ofrece córners
  lineas_total: [7.5, 8.5, 9.5, 10.5, 11.5]
  lineas_equipo: [3.5, 4.5, 5.5]

props:
  ligas: [EPL, SA, LL, BUN, L1]    # las que tienen xG por jugador (Understat)
  minutos_min_temporada: 450       # menos minutos = sin prop (muestra chica)
  minutos_titular: 85
  minutos_suplente: 15
  tasa_al_arco: 0.33               # Understat da tiros totales; ≈ 1/3 van al arco (promedio de ligas top). PROVISIONAL
  factor_rival_limites: [0.6, 1.6]
  max_jugadores_por_equipo: 4      # los de mayor xG/90
  tiros_minimos: [1, 2, 3]

mercados_extendidos:               # probabilidad conjunta con córners y props (motor/dependencia_mercados.py)
  sorteos_parametros: 400          # sorteos de parámetros (incertidumbre)
  sorteos_partido: 300             # partidos simulados por sorteo
  spearman_goles_corners: 0.0      # se SOBREESCRIBE con la correlación medida en el histórico al calcular (0 = sin dato)
  rho_tiros_goles: 0.30            # tiros al arco del jugador vs goles de su equipo (cópula). PROVISIONAL: sin dato por jugador y partido

# ---------------------------------------------------------------------------------------------------------------------------------
# NFL (motor_nfl/): paquete separado, no usa nada del modelo de fútbol.
nfl:
  activo: true
  temporadas_historico: 4          # + la actual
  dias: 8                          # juegos de los próximos N días
  umbral_edge: 0.04
  casas_preferidas: [pinnacle, draftkings, fanduel, betmgm]   # una sola casa por mercado (la mejor cuota entre casas infla el EV)
  aviso: "NFL v1: Elo + EPA con distribución Normal. Los números clave (3 y 7) no se modelan aparte; sin validación walk-forward todavía."
  cuotas:
    sport_key: americanfootball_nfl
    regiones: [us]                 # costo = mercados × regiones = 3 créditos por consulta (mismo presupuesto que el fútbol)
    mercados: [h2h, spreads, totals]
  epa:
    activo: true                   # descarga el play-by-play de nflverse (≈ 25 MB por temporada, una vez; la actual se refresca)
  modelo:
    elo_inicial: 1505
    elo_media: 1505
    k_elo: 20
    hfa_elo: 48                    # ventaja de local en puntos Elo (≈ 1.9 puntos de spread)
    hfa_puntos: 1.5
    elo_por_punto: 25
    regresion_temporada: 0.333
    epa_n0_jugadas: 300            # encogimiento de la EPA hacia 0
    jugadas_por_partido: 62
    peso_epa: 0.5                  # μ = (1 − w)·Elo + w·EPA (cuando hay EPA)
    puntos_n0: 4                   # encogimiento de puntos a favor/en contra hacia la media de la liga
    decaimiento_por_juego: 0.94
    sigma_margen: 13.5             # respaldo; con ≥ min_juegos_sigma se estiman con los residuos
    sigma_total: 10.0
    min_juegos_sigma: 400

valor:
  umbral_edge: 0.04
  umbral_edge_sgp: 0.08
  umbral_edge_sgp_sin_mercado: 0.12

parlays:
  bloques_min: 3
  bloques_max: 5
  p_min_bloque: 0.60
  cuota_min_bloque: 1.30
  cuota_max_bloque: 2.50
  p_min_parlay: 0.15
  max_selecciones_sgp: 2
  redundancia_ratio: 0.98           # P_SGP / min(P_a, P_b) ≥ esto → redundante
  top_n_partidos: 12
  alternativas: 2

bankroll:
  unidad_pct_banca: 0.01
  kelly_fraccion_simple: 0.25
  kelly_fraccion_parlay: 0.10
  stake_max_simple_u: 2.0
  stake_max_parlay_u: 0.5
  exposicion_diaria_max_u: 5.0
  max_simples_con_stake_por_partido: 1
  banca_inicial: 10000              # solo para mostrar dinero; todo se calcula en unidades

liquidacion:
  dias_espera_cierre_csv: 7        # si falta el snapshot de cierre, se espera al CSV antes de "sin CLV"

recalculo:
  dias: [0, 1, 2, 3]               # hoy y los 3 días siguientes (America/Mexico_City); el costo en créditos no crece por día,
                                   # sino por liga con partidos en esa ventana

normalizacion:
  similitud_min: 0.90              # alias automático solo si la similitud es alta...
  margen_min: 0.08                 # ...y claramente mejor que el segundo candidato

operacion:
  picks_min_paper: 300
  criterio_go: cota_inferior_95_clv_ev_mayor_a_0

# ---------------------------------------------------------------------------------------------------------------------------------
# SELECCIONES NACIONALES con modelo PROPIO (2026-11-13). Antes eran «solo mercado» (α = 0) y no aprendían de sus resultados.
# Histórico: martj42/international_results (incluye AMISTOSOS). Los resultados que el CSV aún no trae se agregan desde
# config/selecciones_resultados_extra.csv (y desde The Odds API /scores en la etapa de cuotas). PROVISIONAL hasta el walk-forward.
selecciones_modelo:
  activo: true
  url_historico: https://raw.githubusercontent.com/martj42/international_results/master/results.csv
  anos_historial: 16               # CALIBRADO 2026-11-13 (walk-forward 2022-2024, validado 2024-07→2026-10)
  decaimiento_xi: 0.0006           # CALIBRADO: vida media ≈ 3.2 años
  tope_goles: 6                    # CALIBRADO: un 7-0 cuenta como 6-0 al ajustar
  l2: 0.1                          # CALIBRADO: pooling suave (las selecciones tienen mucho historial)
  rho: -0.05
  pesos_torneo:                    # patrón en el nombre del torneo → peso (el primero que coincide)
    friendly: 1.0                  # CALIBRADO: los amistosos informan tanto como los oficiales (0.4/0.6/0.8 daban peor log-loss)
    world cup: 1.2
    euro: 1.1
    copa am: 1.1
    nations league: 1.0
    qualification: 1.0
    otro: 0.9
  alpha: 0.35                      # peso del modelo propio frente al mercado (sin calibrar: el mercado sigue mandando)
  peso_min: 3.0                    # peso efectivo mínimo de cada selección para usar el modelo (si no: solo mercado)

# FACTORES DE PARTIDO (modelos/factores_partido.py): altitud, clima, motivación, ambiente y sede neutral.
# Sedes en config/sedes.yaml; motivación manual por partido en config/motivacion.yaml. Clima: Open-Meteo (gratis, sin llave).
factores_partido:
  activo: true
  aplicar_sobre_mercado: 0.5       # fracción del ajuste que también se aplica a la λ del MERCADO (la casa ya descuenta parte)
  escala_clubes: 0.5               # en clubes se aplica la mitad: su modelo ya absorbe parte del efecto de su estadio
  aplicar_clubes: true             # también a clubes que estén en config/sedes.yaml (Liga MX: altitud de Toluca, CDMX, Pachuca…). PROVISIONAL: coeficientes calibrados con selecciones
  tope_total: 0.30                 # ningún λ se mueve más de ±30% por factores
  altitud:
    umbral_m: 800                  # debajo de esta diferencia no hay efecto medible (McSharry: el efecto se nota desde ≈ 1000 m)
    por_1000m_propio: 0.20         # CALIBRADO: el que sube mete 20% menos por cada 1000 m sobre el umbral
    por_1000m_rival: 0.0           # CALIBRADO: no se vio efecto en los goles del local
    tope: 0.30
  clima:
    umbral_delta_c: 8              # diferencia de temperatura con su ciudad ese día a partir de la cual pesa
    por_grado: 0.01
    tope: 0.10
    calor_c: 28
    calor_ambos: 0.04
    frio_c: 0
    frio_ambos: 0.03
  motivacion:                      # cambio relativo de λ: propio (sus goles) y rival (los del rival)
    necesita_ganar:  {propio: 0.06, rival: 0.04}
    le_sirve_empate: {propio: -0.08, rival: -0.05}
    nada_en_juego:   {propio: -0.05, rival: 0.02}
    amistoso:        {propio: 0.04, rival: 0.0}    # CALIBRADO: en amistosos hay algo MÁS de goles (defensas mezcladas)
  ambiente:                        # por cada 0.5 de desviación sobre el promedio del estadio
    local: 0.06                    # CALIBRADO
    visitante: 0.15                # CALIBRADO: un estadio hostil pesa sobre todo en los goles del visitante

# Parlays pedidos por el responsable (2026-11-13) para «Qué meter» y «Soñadoras» (servicios/parlays_usuario.py).
# Piernas: «Gana» o «PA(1)» (anota el primer gol), la más probable de cada partido; hasta 3 días; sin repetir partidos entre opciones.
parlays_usuario:
  dias: 3
  que_meter: [3, 4, 5]             # 3 opciones: 3, 4 y 5 partidos
  sonadoras: [6, 8, 10]            # 3 opciones: 6, 8 y 10 partidos
  p_min: 0.55                      # pierna mínima
  confianza_min: 3.5               # confianza de datos mínima (0-10)

# Dashboard de aprendizaje (servicios/aciertos.py, /dashboard). Línea base = walk-forward de selecciones 2024-07→2026-10 (2,420 partidos):
# el punto de partida contra el que se mide si la app va mejorando. PA(1) no tiene línea base (el CSV no trae el minuto de los goles).
dashboard:
  dias: 60
  desde: 2026-11-06               # arranque de la app: el histórico del dashboard se rellena desde aquí
  linea_base:
    Ganador: 0.605
    Ambos anotan: 0.575
    Más de 1.5: 0.728
    Más de 2.5: 0.593
    Menos de 3.5: 0.698

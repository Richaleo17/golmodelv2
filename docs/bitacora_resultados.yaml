# ---------------- Tenis Challenger 26-nov (apuestas del usuario en Caliente; la app los mostraba «solo modelo», 70%+) ----------------
- fecha: 2026-11-26
  deporte: tenis
  liga: ATP Challenger (Florianópolis, Ankara, Monastir 2)
  equipo: 8 favoritos «Gana» en parlays de Caliente
  resultado: 3 de 8 (ganaron Roncadelli, La Serna y Justo; perdieron Gulin vs Ursu, Bar Biryukov vs Pankin, Coulibaly vs Tabacco,
             Alcalá Gurri vs E. Ribeiro y Moller vs Zanellato)
  p_modelo: 0.78             # promedio implícito de Caliente (−188 a −1400); la app también los daba 70%+
  en_modelo: true
  nota: >
    Sin momio en la app (The Odds API no cubre Challenger): probabilidad = Elo puro. Desde el corte de Sackmann (25-may-2026) los
    Challenger llegan solo por LiveScore (~40% menos partidos: sin qualys) y nunca hubo ITF. Varios ganadores tenían pocos datos
    recientes (Zanellato 0 partidos registrados entre el 26-jun y el 25-nov). Se midió con scripts/validar_tenis_challenger.py: con ese
    mismo hueco de datos, los favoritos Challenger de 70%+ aciertan 76.9% (823 partidos, esperado 75.7%), no se degradan con los meses
    y NI agregar ITF NI filtrar por pocos partidos recientes mejora. 3 de 8 con ~6 esperados pasa ~1-2% de las veces: día malo, no
    falla del modelo. No se cambia nada (ver decisiones.md 2026-11-27).


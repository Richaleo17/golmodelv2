- fecha: 2026-11-23
  deporte: futbol
  liga: MLS
  equipo: Nashville SC
  rival: pendiente
  mercado: goles del equipo (solo anotó 1)
  p_modelo: pendiente
  resultado: Nashville anotó 1 gol
  en_modelo: true
  nota: >
    El resultado entra solo con la ingesta (resultado confirmado) y el siguiente ajuste de
    Dixon-Coles baja un poco el ataque de Nashville, con el peso que le toca por recencia.
    No se aplica castigo extra. Revisar si Nashville se queda corto de goles varias veces
    seguidas en esta bitácora.
